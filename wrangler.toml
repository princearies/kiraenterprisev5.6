name = "kiraenterprisev5-6"
main = "worker/src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "mykira"
database_id = "4037f2cd-0c4a-4251-846e-534eb7b47338"

# NOTE: R2 Bucket binding removed - bucket 'kiraenterprise-documents' not yet created.
# To enable document storage, create the bucket first:
#   npx wrangler r2 bucket create kiraenterprise-documents
# Then uncomment the following:
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "kiraenterprise-documents"

# Environment Variables
[vars]
APP_NAME = "KiraEnterprise"
APP_VERSION = "5.6"
ENVIRONMENT = "production"
REGION = "MY-SABAH"

# Secrets (set via wrangler secret put)
# JWT_SECRET
# LHDN_API_KEY
# LHDN_CLIENT_ID
# LHDN_CLIENT_SECRET
